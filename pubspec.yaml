name: bhu_control_app
description: Sistema de Control BHU - Gestión de Depósitos para Android
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Material Design 3
  material_color_utilities: ^0.13.0
  
  # Base de datos local
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.8.3
  
  # Manejo de estado
  provider: ^6.1.1
  
  # HTTP para API calls
  http: ^1.1.0
  dio: ^5.4.0
  
  # Formato de fechas y números
  intl: ^0.18.1
  
  # Almacenamiento local
  shared_preferences: ^2.5.3
  
  # Generación de IDs únicos
  uuid: ^4.2.1
  
  # Exportación a CSV/Excel
  csv: ^5.0.0
  share_plus: ^12.0.1

  # PDF
  pdf: ^3.10.4
  file_saver: ^0.3.1
  
  # Permisos y archivos
  permission_handler: ^11.0.0
  path_provider: ^2.1.5
  file_selector: ^1.1.0

  # Logging
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700