name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas a compilar (separadas por coma)'
        required: false
        default: 'web,android,linux,macos,windows,ios'
      create_release:
        description: 'Crear release'
        type: boolean
        default: false
  repository_dispatch:
    types:
      - build-selection

jobs:
  # ============================================
  # Determine platforms to build
  # ============================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_web: ${{ steps.set_platforms.outputs.build_web }}
      build_android: ${{ steps.set_platforms.outputs.build_android }}
      build_linux: ${{ steps.set_platforms.outputs.build_linux }}
      build_macos: ${{ steps.set_platforms.outputs.build_macos }}
      build_ios: ${{ steps.set_platforms.outputs.build_ios }}
      build_windows: ${{ steps.set_platforms.outputs.build_windows }}
    steps:
      - id: set_platforms
        run: |
          # Default to all platforms for push to main or tags
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "build_web=true" >> $GITHUB_OUTPUT
            echo "build_android=false" >> $GITHUB_OUTPUT
            echo "build_linux=false" >> $GITHUB_OUTPUT
            echo "build_macos=false" >> $GITHUB_OUTPUT
            echo "build_ios=false" >> $GITHUB_OUTPUT
            echo "build_windows=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "build_web=true" >> $GITHUB_OUTPUT
            echo "build_android=true" >> $GITHUB_OUTPUT
            echo "build_linux=true" >> $GITHUB_OUTPUT
            echo "build_macos=true" >> $GITHUB_OUTPUT
            echo "build_ios=true" >> $GITHUB_OUTPUT
            echo "build_windows=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "build_web=true" >> $GITHUB_OUTPUT
            echo "build_android=true" >> $GITHUB_OUTPUT
            echo "build_linux=true" >> $GITHUB_OUTPUT
            echo "build_macos=true" >> $GITHUB_OUTPUT
            echo "build_ios=true" >> $GITHUB_OUTPUT
            echo "build_windows=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Checking platforms: ${{ github.event.inputs.platforms }}"
            if [[ "${{ github.event.inputs.platforms }}" == *"web"* ]]; then echo "build_web=true" >> $GITHUB_OUTPUT; else echo "build_web=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.inputs.platforms }}" == *"android"* ]]; then echo "build_android=true" >> $GITHUB_OUTPUT; else echo "build_android=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.inputs.platforms }}" == *"linux"* ]]; then echo "build_linux=true" >> $GITHUB_OUTPUT; else echo "build_linux=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.inputs.platforms }}" == *"macos"* ]]; then echo "build_macos=true" >> $GITHUB_OUTPUT; else echo "build_macos=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.inputs.platforms }}" == *"ios"* ]]; then echo "build_ios=true" >> $GITHUB_OUTPUT; else echo "build_ios=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.inputs.platforms }}" == *"windows"* ]]; then echo "build_windows=true" >> $GITHUB_OUTPUT; else echo "build_windows=false" >> $GITHUB_OUTPUT; fi
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "Checking repository_dispatch platforms: ${{ github.event.client_payload.platforms }}"
            if [[ "${{ github.event.client_payload.platforms }}" == *"web"* ]]; then echo "build_web=true" >> $GITHUB_OUTPUT; else echo "build_web=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.client_payload.platforms }}" == *"android"* ]]; then echo "build_android=true" >> $GITHUB_OUTPUT; else echo "build_android=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.client_payload.platforms }}" == *"linux"* ]]; then echo "build_linux=true" >> $GITHUB_OUTPUT; else echo "build_linux=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.client_payload.platforms }}" == *"macos"* ]]; then echo "build_macos=true" >> $GITHUB_OUTPUT; else echo "build_macos=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.client_payload.platforms }}" == *"ios"* ]]; then echo "build_ios=true" >> $GITHUB_OUTPUT; else echo "build_ios=false" >> $GITHUB_OUTPUT; fi
            if [[ "${{ github.event.client_payload.platforms }}" == *"windows"* ]]; then echo "build_windows=true" >> $GITHUB_OUTPUT; else echo "build_windows=false" >> $GITHUB_OUTPUT; fi
          fi

  # ============================================
  # Web Build (GitHub Pages)
  # ============================================
  web:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.build_web == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --base-href "/BHU-Control/"

      - name: Copy Service Worker
        run: cp web/sw.js build/web/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    needs: [setup, web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================
  # Linux Build
  # ============================================
  linux:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.build_linux == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        if: success()
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../bhu_control_linux.zip .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bhu_control_linux.zip

  # ============================================
  # macOS Build
  # ============================================
  macos:
    runs-on: macos-latest
    needs: setup
    if: needs.setup.outputs.build_macos == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create ZIP
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          zip -r bhu_control_macos.zip .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/bhu_control_macos.zip

  # ============================================
  # iOS Build (Ad-hoc / Simulator)
  # ============================================
  ios:
    runs-on: macos-latest
    needs: setup
    if: needs.setup.outputs.build_ios == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Simulator)
        run: flutter build ios --simulator --no-codesign

      - name: Create ZIP
        if: success()
        run: |
          cd build/ios/iphonesimulator
          zip -r bhu_control_ios_simulator.zip .

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphonesimulator/bhu_control_ios_simulator.zip

  # ============================================
  # Android Build
  # ============================================
  android:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.build_android == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (APK)
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================
  # Windows Build
  # ============================================
  windows:
    runs-on: windows-latest
    needs: setup
    if: needs.setup.outputs.build_windows == 'true'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        if: success()
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path .\* -DestinationPath bhu_control_windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/bhu_control_windows.zip

  # ============================================
  # Create Release (on tag, release, or workflow_dispatch)
  # ============================================
  release:
    needs: [setup, linux, macos, ios, android, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || (github.event_name == 'repository_dispatch')
    permissions:
      contents: write
    
    steps:
      - name: Download Linux artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./release

      - name: Download macOS artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./release

      - name: Download iOS artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ./release

      - name: Download Android artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: ./release

      - name: Download Windows artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
